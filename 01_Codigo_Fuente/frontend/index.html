<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus PC – Catálogo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Encabezado: logo, botón del carrito y botón ☰ (solo se ve en celular) -->
  <header class="encabezado">
    <div class="barra">
      <span class="logo">Nexus PC</span>
      <!-- Botón "Carrito" y su vista rápida (el panel aparece justo debajo) -->
      <div id="carrito-caja" class="carrito-caja">
        <button id="btn-carrito" class="boton-carrito" type="button"
                aria-expanded="false" aria-controls="panel-carrito">
          Carrito <span id="contador-carrito" class="contador" aria-live="polite" aria-label="0 artículos">0</span>
        </button>
        <section id="panel-carrito" class="panel-carrito" role="region" aria-label="Vista rápida del carrito" hidden>
          <h2 id="panel-titulo" class="panel-titulo"></h2>
          <ul id="panel-lista" class="panel-lista" tabindex="0" aria-label="Productos del carrito"></ul>
          <p id="panel-vacio" class="panel-vacio" hidden>Aún no agregaste productos.</p>
          <p id="panel-total" class="panel-total"><span>Total</span><span id="panel-total-valor"></span></p>
          <button id="panel-ver" class="panel-boton" type="button" disabled>Disponible en la siguiente etapa</button>
          <button id="panel-explorar" class="panel-boton" type="button" hidden>Explorar catálogo</button>
        </section>
      </div>
      <button id="btn-menu" class="boton-menu" type="button"
              aria-expanded="false" aria-controls="menu-categorias"
              aria-label="Abrir menú de categorías">☰</button>
    </div>
    <!-- Menú de categorías: lo llena app.js con los datos -->
    <nav id="menu-categorias" class="menu" aria-label="Categorías"></nav>
  </header>

  <main class="catalogo">
    <h1 id="titulo-categoria">Catálogo</h1>
    <p id="subtitulo-categoria" class="subtitulo"></p>
    <!-- Mensajes de "Cargando..." y de error -->
    <div id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></div>
    <!-- Tarjetas de productos -->
    <div id="lista-productos" class="cuadricula"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
